[project]
name = "api"
version = "0.1.0"
description = "HTTP API for trading, portfolios, and player interactions in 2TheMoon."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "shared",
    "uvicorn>=0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.sources]
shared = { path = "../shared", editable = true }
