[project]
name = "api"
version = "0.1.0"
description = "HTTP API for trading, portfolios, and player interactions in 2TheMoon."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "shared",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a live Supabase project (requires TEST_USER_EMAIL/TEST_USER_PASSWORD)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
