services:
  redis:
    image: redis:7-alpine
    container_name: 2themoon-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: 2themoon-api
    container_name: 2themoon-api
    env_file:
      - api/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  gameserver:
    build:
      context: .
      dockerfile: gameserver/Dockerfile
    image: 2themoon-gameserver
    container_name: 2themoon-gameserver
    env_file:
      - gameserver/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  redis-data: