[project]
name = "shared"
version = "0.1.0"
description = "Shared database models and utilities for the 2TheMoon API and game server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.16.0",
    "postgrest>=2.32.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "supabase>=2.33.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["shared"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
