[project]
name = "shared"
version = "0.1.0"
description = "Shared database models and utilities for the 2TheMoon API and game server."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "postgrest>=2.32.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "supabase>=2.32.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["shared"]
