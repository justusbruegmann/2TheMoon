name: Gameserver Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  REGISTRY: docker.how2centeradiv.de
  IMAGE_NAME: 2themoon/gameserver

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: |
            gameserver/uv.lock
            shared/uv.lock

      - name: Install gameserver dependencies
        working-directory: gameserver
        run: uv sync --locked

      - name: Run gameserver tests
        working-directory: gameserver
        run: uv run pytest tests

      - name: Install shared dependencies
        working-directory: shared
        run: uv sync --locked

      - name: Run shared tests
        working-directory: shared
        run: uv run pytest tests

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_BUILD_USER_NAME }}
          password: ${{ secrets.REGISTRY_BUILD_USER_PASSWORD }}

      - name: Gen Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gameserver/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}