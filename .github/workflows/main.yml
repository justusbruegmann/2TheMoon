name: Sync YouTrack KB
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: rm -rf kb && python scripts/sync_kb.py
        env:
          YOUTRACK_URL: ${{ secrets.YOUTRACK_URL }}
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: kb-sync
          commit-message: Sync YouTrack KB
          title: Sync YouTrack KB
          body: Automatic export of the YouTrack knowledge base.
          add-paths: kb
          delete-branch: true