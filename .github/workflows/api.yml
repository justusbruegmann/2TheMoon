name: API Tests

on:
  pull_request:
  push:
    branches:
      - main
      - buildtest

env:
  REGISTRY: docker.how2centeradiv.de
  IMAGE_NAME: 2themoon/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            shared/uv.lock

      - name: Install api dependencies
        working-directory: api
        run: uv sync --locked --dev

      - name: Run api tests
        working-directory: api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GAMESERVER_SHARED_SECRET: ${{ secrets.GAMESERVER_SHARED_SECRET }}
        run: uv run pytest tests

      - name: Install shared dependencies
        working-directory: shared
        run: uv sync --locked --dev

      - name: Run shared tests
        working-directory: shared
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: uv run pytest tests
  build:
    runs-on: ubuntu-latest

      steps:
          - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Bei eigener Registry einloggen
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ secrets.REGISTRY_BUILD_USER_NAME }}
                password: ${{ secrets.REGISTRY_BUILD_USER_PASSWORD }}

            - name: Tags erzeugen
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                tags: |
                  type=ref,event=branch
                  type=semver,pattern={{version}}
                  type=semver,pattern={{major}}.{{minor}}

            - name: Image bauen und pushen
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}